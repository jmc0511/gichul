<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>기추리 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Serif+KR:wght@700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .adm { max-width: 1100px; }
  .adm .top a { color: var(--muted); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .card .k { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .card .v { font-family: var(--f-num); font-size: 26px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .card .d { font-size: 12.5px; color: var(--muted); }
  .state { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
  .state::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .state.ok { color: var(--ok); } .state.bad { color: var(--wrong); } .state.warn { color: var(--omr); }
  .box { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .box h2 { margin: 0; font-size: 14px; }
  .box h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
  @media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
  /* 14일 막대 */
  .bars { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px; align-items: end; height: 150px; border-bottom: 1px solid var(--line); position: relative; }
  .bar { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; background: none; border: 0; padding: 0; }
  .bar i { display: block; width: min(70%, 22px); background: var(--omr); flex: none; }
  .bar i.err { background: var(--wrong); }
  .bar i.other { background: var(--muted); opacity: .45; }
  .bar i.end { border-radius: 4px 4px 0 0; }
  .bar .col { display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; width: 100%; height: 100%; justify-content: flex-start; }
  .bar:hover .col i, .bar:focus-visible .col i { filter: brightness(1.1); }
  .ticks { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px; font-family: var(--f-num); font-size: 10.5px; color: var(--muted); text-align: center; }
  .tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -6px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--omr); }
  .legend span.e::before { background: var(--wrong); }
  .legend span.o::before { background: var(--muted); opacity: .45; }
  /* 사용량 막대 */
  .meter { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .meter .row { display: flex; justify-content: space-between; gap: 8px; }
  .meter .row b { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter .track { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .meter .fill { height: 100%; background: var(--ink); border-radius: 4px; }
  .meter .fill.hi { background: var(--wrong); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num { font-family: var(--f-num); white-space: nowrap; }
  td .detail { color: var(--muted); font-family: var(--f-num); font-size: 12px; overflow-wrap: anywhere; }
  .scroll { overflow-x: auto; }
  .msg { padding: 40px 0; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .foot { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap adm">
  <header class="top">
    <div class="brand">
      <h1>기추리 <b>관리</b></h1>
      <p id="updated">불러오는 중…</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="reload" type="button">새로고침</button>
      <a href="./">사이트로</a>
    </div>
  </header>
  <main id="main"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
