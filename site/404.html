<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 · 기추리</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Noto+Serif+KR:wght@900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .nf-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px; max-width: 420px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .nf-card img { width: 120px; height: 120px; }
  .nf-code { font-family: var(--f-num); font-weight: 600; color: var(--omr); font-size: 15px; letter-spacing: .1em; }
  .nf-card h1 { margin: 0; font-size: 22px; }
  .nf-card p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .nf-card .btn { text-decoration: none; color: var(--paper); margin-top: 6px; padding: 10px 18px; }
</style>
</head>
<body>
<main class="nf">
  <div class="nf-card">
    <img src="/icon-192.png" alt="">
    <span class="nf-code">404</span>
    <h1>이 페이지는 출제 범위 밖이에요</h1>
    <p>주소가 바뀌었거나 없는 페이지예요. 시험지 링크라면 받은 주소를 다시 확인해 주세요.</p>
    <a class="btn primary" href="/">기추리로 가기</a>
  </div>
</main>
</body>
</html>
