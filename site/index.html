<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기출 출제실</title>
<meta name="description" content="공부자료 PDF를 올리면 시험에 나올 법한 기출 스타일 문제를 만들어 주는 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>기출 <b>출제실</b></h1>
      <p>공부자료 PDF를 넣으면 시험에 나올 법한 문제를 출제합니다</p>
    </div>
    <div class="top-actions">
      <div class="account" id="account"></div>
      <button class="btn help-btn" id="tourBtn" type="button">사용법</button>
    </div>
  </header>

  <div class="grid">
    <aside class="panel" aria-label="출제 설정">
      <div class="step">
        <h2><span>1</span>공부자료</h2>
        <label class="drop" id="drop" for="file">
          <strong>PDF·PPTX를 끌어다 놓거나 눌러서 선택</strong>
          <small>강의노트, 강의 슬라이드, 교재 발췌 · 여러 개 가능</small>
          <input type="file" id="file" accept=".pdf,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation" multiple>
        </label>
        <ul class="files" id="files"></ul>
      </div>

      <div class="step">
        <h2><span>2</span>출제 조건</h2>
        <div class="field">
          <label for="subject">과목 / 시험명</label>
          <input type="text" id="subject" placeholder="예: 운영체제 중간고사">
        </div>
        <div class="field">
          <span class="lbl">문항 수</span>
          <div class="seg" role="radiogroup" aria-label="문항 수">
            <label><input type="radio" name="count" id="c5" value="5"><span class="num">5</span></label>
            <label><input type="radio" name="count" id="c10" value="10" checked><span class="num">10</span></label>
            <label><input type="radio" name="count" id="c15" value="15"><span class="num">15</span></label>
            <label><input type="radio" name="count" id="c20" value="20"><span class="num">20</span></label>
          </div>
        </div>
        <div class="field">
          <span class="lbl">문제 유형</span>
          <div class="seg" aria-label="문제 유형">
            <label><input type="checkbox" name="type" id="t-mc" value="mc" checked><span>객관식 5지선다</span></label>
            <label><input type="checkbox" name="type" id="t-ox" value="ox"><span>O / X</span></label>
            <label><input type="checkbox" name="type" id="t-short" value="short" checked><span>단답형</span></label>
            <label><input type="checkbox" name="type" id="t-essay" value="essay"><span>서술형</span></label>
          </div>
        </div>
        <div class="field">
          <span class="lbl">외국어 영역 <span style="font-weight:400;color:var(--muted)">(외국어 시험일 때)</span></span>
          <div class="seg" aria-label="외국어 영역">
            <label><input type="checkbox" name="area" id="a-vocab" value="어휘"><span>어휘</span></label>
            <label><input type="checkbox" name="area" id="a-grammar" value="문법"><span>문법</span></label>
            <label><input type="checkbox" name="area" id="a-reading" value="독해"><span>독해</span></label>
            <label><input type="checkbox" name="area" id="a-trans" value="해석·작문"><span>해석·작문</span></label>
          </div>
        </div>
        <div class="field">
          <span class="lbl">문제 언어</span>
          <div class="seg" role="radiogroup" aria-label="문제 언어">
            <label><input type="radio" name="lang" id="lang-ko" value="ko" checked><span>한국어</span></label>
            <label><input type="radio" name="lang" id="lang-src" value="src"><span>자료 언어 그대로</span></label>
            <label><input type="radio" name="lang" id="lang-mix" value="mix"><span>문제는 외국어 · 해설은 한국어</span></label>
          </div>
        </div>
        <div class="field">
          <span class="lbl">난이도</span>
          <div class="seg" role="radiogroup" aria-label="난이도">
            <label><input type="radio" name="level" id="l1" value="기본 개념 확인"><span>기본</span></label>
            <label><input type="radio" name="level" id="l2" value="실제 시험 수준" checked><span>실전</span></label>
            <label><input type="radio" name="level" id="l3" value="상위권 변별용 고난도"><span>고난도</span></label>
          </div>
        </div>
        <div class="field">
          <label for="extra">추가 요청 <span style="font-weight:400;color:var(--muted)">(선택)</span></label>
          <textarea id="extra" placeholder="예: 3장 스케줄링 위주로, 계산 문제 2개 이상"></textarea>
        </div>
      </div>

      <button class="go" id="go" type="button" disabled>출제 요청 보내기</button>
      <p class="quota" id="quota" hidden></p>
      <p class="status" id="status" aria-live="polite">PDF를 올리고 요청을 보내면 문제를 만들어 문제집에 올려 드려요.</p>

      <div class="step">
        <h2><span>3</span>문제집</h2>
        <p class="lib-h" id="reqHead" hidden>내 출제 요청</p>
        <ul class="lib" id="reqList"></ul>
        <p class="lib-h">내 시험지</p>
        <ul class="lib" id="examList"></ul>
      </div>
    </aside>

    <main class="sheet" id="sheet" aria-label="시험지"></main>

    <aside class="omr" aria-label="OMR 답안지">
      <div class="omr-head"><span>답안지</span><span id="omrCount"></span></div>
      <div class="omr-score"><span class="big" id="scoreBig">–</span><small id="scoreSub">답을 고른 뒤 채점하세요</small></div>
      <div class="omr-rows" id="omrRows"></div>
      <div class="omr-actions">
        <button class="btn primary" id="grade" type="button">채점하기</button>
        <button class="btn" id="showAll" type="button">해설 모두 보기</button>
        <button class="btn" id="reset" type="button">답안 지우기</button>
        <button class="btn" id="save" type="button">시험지 파일로 저장</button>
      </div>
    </aside>
  </div>
</div>

<div class="mbar" aria-label="채점 바">
  <span class="mbar-prog" id="mProg"></span>
  <button class="btn" id="mOmr" type="button">답안지</button>
  <button class="btn primary" id="mGrade" type="button">채점하기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="tour.js"></script>
</body>
</html>
