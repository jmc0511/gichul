<title>기출 출제실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* Layout: 왼쪽은 자료·출제 설정 데스크, 가운데는 시험지, 오른쪽은 OMR 답안지. 좁은 화면에서는 위에서 아래로 쌓임 */
:root {
  --desk: #e9ecf0;
  --paper: #ffffff;
  --ink: #1a2130;
  --muted: #5b6475;
  --line: #d3d8e0;
  --omr: #cf3f63;
  --omr-soft: #fbe8ed;
  --ok: #24764a;
  --ok-soft: #e3f2e9;
  --wrong: #b3261e;
  --wrong-soft: #fbe5e3;
  --chip: #f2f4f7;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.06);
  --f-exam: "Noto Serif KR", "Batang", "AppleMyungjo", serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #11141a; --paper: #1a1e26; --ink: #e5e8ed; --muted: #98a1b0; --line: #2e3542;
    --omr: #f17c99; --omr-soft: #3a1f29; --ok: #74c795; --ok-soft: #173225; --wrong: #ff8f85; --wrong-soft: #3d1c1a;
    --chip: #232833; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #11141a; --paper: #1a1e26; --ink: #e5e8ed; --muted: #98a1b0; --line: #2e3542;
  --omr: #f17c99; --omr-soft: #3a1f29; --ok: #74c795; --ok-soft: #173225; --wrong: #ff8f85; --wrong-soft: #3d1c1a;
  --chip: #232833; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--desk); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--omr); outline-offset: 2px; }

.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--f-exam); font-weight: 900; font-size: 26px; letter-spacing: -.02em; }
.brand h1 b { color: var(--omr); font-weight: 900; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }

.grid { display: grid; grid-template-columns: 340px minmax(0, 1fr) 220px; gap: 18px; align-items: start; }
@media (max-width: 1180px) { .grid { grid-template-columns: 320px minmax(0, 1fr); } .omr { grid-column: 2; } }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } .omr { grid-column: auto; } }

/* 설정 패널 */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
.lib { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lib li { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 8px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; }
.lib li.cur { border-color: var(--ink); }
.lib .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.lib .s { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-family: var(--f-num); }
.lib button.open { border: 0; background: none; color: var(--omr); font-weight: 600; font-size: 13px; padding: 0; }
.pill { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; background: var(--chip); color: var(--muted); }
.pill.pending { background: var(--chip); color: var(--ink); }
.pill.working { background: var(--omr-soft); color: var(--omr); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.error { background: var(--wrong-soft); color: var(--wrong); }
.lib-h { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 4px 0 0; }
.step { display: flex; flex-direction: column; gap: 10px; }
.step h2 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.step h2 span { font-family: var(--f-num); color: var(--omr); }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px 14px; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; transition: border-color .15s, background .15s; cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--omr); background: var(--omr-soft); }
.drop strong { font-weight: 600; }
.drop small { color: var(--muted); font-size: 12.5px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.files li { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; align-items: center; background: var(--chip); border-radius: 6px; padding: 7px 10px; font-size: 13.5px; }
.files .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files .meta { font-family: var(--f-num); font-size: 12px; color: var(--muted); white-space: nowrap; }
.files .meta.warn { color: var(--omr); }
.files button { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 16px; line-height: 1; }
.files button:hover { color: var(--wrong); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; }
.field input[type=text], .field textarea, .field select { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.field textarea { resize: vertical; min-height: 56px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-block; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: var(--paper); }
.seg input:checked + span { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.seg input:focus-visible + span { outline: 2px solid var(--omr); outline-offset: 2px; }
.seg .num { font-family: var(--f-num); }

.go { border: 0; background: var(--omr); color: #fff; border-radius: 8px; padding: 12px 14px; font-weight: 700; font-size: 15px; }
.go:disabled { opacity: .45; cursor: not-allowed; }
.go.stop { background: var(--ink); color: var(--paper); }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; }
.status.err { color: var(--wrong); }

/* 시험지 */
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 44px); min-width: 0; }
.ex-flag { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--omr); background: var(--omr-soft); border-radius: 999px; padding: 3px 10px; margin-bottom: 14px; }
.sheet-head { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
.sheet-head .kicker { font-family: var(--f-exam); font-size: 14px; color: var(--muted); letter-spacing: .1em; }
.sheet-head h2 { margin: 0; font-family: var(--f-exam); font-weight: 900; font-size: clamp(22px, 3.2vw, 32px); letter-spacing: -.01em; text-wrap: balance; }
.sheet-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); padding-block: 10px; border-bottom: 1px solid var(--ink); margin-bottom: 22px; }
.sheet-meta .blank { display: inline-block; width: 90px; border-bottom: 1px solid var(--muted); }
.sheet-meta .tn { font-family: var(--f-num); }

.questions { columns: 2 320px; column-gap: 40px; column-rule: 1px solid var(--line); }
.q { break-inside: avoid; margin: 0 0 28px; font-family: var(--f-exam); font-size: 15.5px; line-height: 1.75; }
.q-text { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.q-no { font-weight: 900; margin-right: 6px; font-family: var(--f-num); }
.q-pts { font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.q-type { font-family: var(--f-ui); font-size: 11.5px; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 4px; vertical-align: 2px; }
.choices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.choice { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 4px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 3px 6px; font-family: inherit; font-size: inherit; line-height: 1.6; }
.choice:hover { background: var(--chip); }
.choice .mk { font-family: var(--f-ui); }
.choice.sel { background: var(--chip); font-weight: 700; }
.choice.sel .mk { color: var(--omr); }
.choice.right { background: var(--ok-soft); }
.choice.right .mk { color: var(--ok); }
.choice.miss { background: var(--wrong-soft); text-decoration: line-through; text-decoration-color: var(--wrong); }
.ox { display: flex; gap: 10px; }
.ox .choice { width: auto; grid-template-columns: auto; padding: 4px 18px; border: 1px solid var(--line); font-family: var(--f-num); font-weight: 600; }
.write { width: 100%; min-height: 64px; border: 0; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(transparent 0 27px, var(--line) 27px 28px); line-height: 28px; resize: vertical; font-family: var(--f-exam); padding: 0 4px; }
.write.short { min-height: 32px; }
.q-tools { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--f-ui); }
.link { background: none; border: 0; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--omr); }
.sol { margin-top: 10px; font-family: var(--f-ui); font-size: 13.5px; line-height: 1.65; border-left: 3px solid var(--omr); padding: 8px 12px; background: var(--chip); border-radius: 0 6px 6px 0; display: flex; flex-direction: column; gap: 4px; }
.sol .ans { font-weight: 700; }
.sol .src { color: var(--muted); font-size: 12.5px; }
.sol p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.selfcheck { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.selfcheck button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
.selfcheck button.on-ok { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.selfcheck button.on-no { background: var(--wrong); border-color: var(--wrong); color: var(--paper); }

.empty { text-align: center; padding-block: 60px; color: var(--muted); font-family: var(--f-ui); }
.loading { display: flex; flex-direction: column; gap: 14px; padding-block: 8px; }
.loading .bar { height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--chip), var(--line), var(--chip)); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .loading .bar { animation: none; } }

/* OMR 답안지 */
.omr { background: var(--paper); border: 1px solid var(--omr); border-radius: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); overflow: hidden; }
@media (max-width: 820px) { .omr { position: static; } }
.omr-head { background: var(--omr); color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 13px; letter-spacing: .08em; }
.omr-score { padding: 12px; border-bottom: 1px solid var(--omr); display: flex; flex-direction: column; gap: 2px; text-align: center; }
.omr-score .big { font-family: var(--f-num); font-size: 30px; font-weight: 600; color: var(--omr); line-height: 1.2; font-variant-numeric: tabular-nums; }
.omr-score small { color: var(--muted); font-size: 12px; }
.omr-rows { padding: 6px 8px; display: flex; flex-direction: column; max-height: 60vh; overflow-y: auto; }
@media (max-width: 1180px) { .omr-rows { max-height: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); column-gap: 14px; } }
.omr-row { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 4px; padding-block: 3px; border-bottom: 1px dotted var(--omr-soft); }
.omr-row .n { font-family: var(--f-num); font-size: 12px; color: var(--omr); text-align: right; padding-right: 4px; font-variant-numeric: tabular-nums; }
.omr-row.right .n { color: var(--ok); }
.omr-row.wrongrow .n { color: var(--wrong); }
.bubbles { display: flex; gap: 4px; }
.bub { width: 22px; height: 26px; border-radius: 50%; border: 1px solid var(--omr); background: transparent; font-family: var(--f-num); font-size: 10.5px; color: var(--omr); padding: 0; display: grid; place-items: center; }
.bub.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.bub.key { box-shadow: 0 0 0 2px var(--ok); }
.omr-note { font-size: 12px; color: var(--muted); padding: 2px 4px; }
.omr-actions { padding: 10px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--omr); }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; font-weight: 600; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>기출 <b>출제실</b></h1>
      <p>공부자료 PDF를 넣으면 시험에 나올 법한 문제를 출제합니다</p>
    </div>
  </header>

  <div class="grid">
    <aside class="panel" aria-label="출제 설정">
      <div class="step">
        <h2><span>1</span>공부자료</h2>
        <label class="drop" id="drop" for="file">
          <strong>PDF를 끌어다 놓거나 눌러서 선택</strong>
          <small>강의노트, 교재 발췌, 요약본 · 여러 개 가능</small>
          <input type="file" id="file" accept="application/pdf,.pdf" multiple>
        </label>
        <ul class="files" id="files"></ul>
      </div>

      <div class="step">
        <h2><span>2</span>출제 조건</h2>
        <div class="field">
          <label for="subject">과목 / 시험명</label>
          <input type="text" id="subject" placeholder="예: 운영체제 중간고사">
        </div>
        <div class="field">
          <span class="lbl">문항 수</span>
          <div class="seg" role="radiogroup" aria-label="문항 수">
            <label><input type="radio" name="count" id="c5" value="5"><span class="num">5</span></label>
            <label><input type="radio" name="count" id="c10" value="10" checked><span class="num">10</span></label>
            <label><input type="radio" name="count" id="c15" value="15"><span class="num">15</span></label>
            <label><input type="radio" name="count" id="c20" value="20"><span class="num">20</span></label>
          </div>
        </div>
        <div class="field">
          <span class="lbl">문제 유형</span>
          <div class="seg" aria-label="문제 유형">
            <label><input type="checkbox" name="type" id="t-mc" value="mc" checked><span>객관식 5지선다</span></label>
            <label><input type="checkbox" name="type" id="t-ox" value="ox"><span>O / X</span></label>
            <label><input type="checkbox" name="type" id="t-short" value="short" checked><span>단답형</span></label>
            <label><input type="checkbox" name="type" id="t-essay" value="essay"><span>서술형</span></label>
          </div>
        </div>
        <div class="field">
          <span class="lbl">외국어 영역 <span style="font-weight:400;color:var(--muted)">(외국어 시험일 때)</span></span>
          <div class="seg" aria-label="외국어 영역">
            <label><input type="checkbox" name="area" id="a-vocab" value="어휘"><span>어휘</span></label>
            <label><input type="checkbox" name="area" id="a-grammar" value="문법"><span>문법</span></label>
            <label><input type="checkbox" name="area" id="a-reading" value="독해"><span>독해</span></label>
            <label><input type="checkbox" name="area" id="a-trans" value="해석·작문"><span>해석·작문</span></label>
          </div>
        </div>
        <div class="field">
          <span class="lbl">문제 언어</span>
          <div class="seg" role="radiogroup" aria-label="문제 언어">
            <label><input type="radio" name="lang" id="lang-ko" value="ko" checked><span>한국어</span></label>
            <label><input type="radio" name="lang" id="lang-src" value="src"><span>자료 언어 그대로</span></label>
            <label><input type="radio" name="lang" id="lang-mix" value="mix"><span>문제는 외국어 · 해설은 한국어</span></label>
          </div>
        </div>
        <div class="field">
          <span class="lbl">난이도</span>
          <div class="seg" role="radiogroup" aria-label="난이도">
            <label><input type="radio" name="level" id="l1" value="기본 개념 확인"><span>기본</span></label>
            <label><input type="radio" name="level" id="l2" value="실제 시험 수준" checked><span>실전</span></label>
            <label><input type="radio" name="level" id="l3" value="상위권 변별용 고난도"><span>고난도</span></label>
          </div>
        </div>
        <div class="field">
          <label for="extra">추가 요청 <span style="font-weight:400;color:var(--muted)">(선택)</span></label>
          <textarea id="extra" placeholder="예: 3장 스케줄링 위주로, 계산 문제 2개 이상"></textarea>
        </div>
      </div>

      <button class="go" id="go" type="button" disabled>기출문제 출제하기</button>
      <p class="status" id="status" aria-live="polite">PDF를 올리면 출제할 수 있습니다.</p>

      <div class="step" id="libStep" hidden>
        <h2><span>3</span>문제집</h2>
        <p class="lib-h" id="reqHead" hidden>출제 요청</p>
        <ul class="lib" id="reqList"></ul>
        <p class="lib-h">완성된 시험지</p>
        <ul class="lib" id="examList"></ul>
      </div>
    </aside>

    <main class="sheet" id="sheet" aria-label="시험지"></main>

    <aside class="omr" aria-label="OMR 답안지">
      <div class="omr-head"><span>답안지</span><span id="omrCount"></span></div>
      <div class="omr-score" id="omrScore"><span class="big" id="scoreBig">–</span><small id="scoreSub">답을 고른 뒤 채점하세요</small></div>
      <div class="omr-rows" id="omrRows"></div>
      <div class="omr-actions">
        <button class="btn primary" id="grade" type="button">채점하기</button>
        <button class="btn" id="showAll" type="button">해설 모두 보기</button>
        <button class="btn" id="reset" type="button">답안 지우기</button>
        <button class="btn" id="save" type="button" hidden>시험지 파일로 저장</button>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const MARKS = ["①", "②", "③", "④", "⑤"];
  const TYPE_LABEL = { mc: "객관식", ox: "O/X", short: "단답형", essay: "서술형" };
  const TEXT_BUDGET = 150000;

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  const EXAMPLE = {
    subject: "운영체제 중간고사",
    title: "운영체제 3장 · CPU 스케줄링 예상 기출",
    questions: [

  const state = {
    files: [],          // {id, name, pages:[text], pdf, scanned}
    exam: null,
    isExample: true,

    self: {},           // idx -> true/false (서술·단답 자가채점)
    open: {},           // idx -> 해설 표시 여부
    graded: false,
    busy: null
  };

  let sample = null, downloads = null, imgLimits = null, capsChecked = false;
  let db = null, me = null, isOwner = false, canWrite = null;
  let exams = [], requests = [], curExamId = null;
  const CHUNK = 60000;

  /* ---------- 저장(내 브라우저에만) ---------- */
  function persist() {
    try { localStorage.setItem("gichul.exam", JSON.stringify({ exam: state.exam, isExample: state.isExample, answers: state.answers })); } catch (e) {}
  }
  function restore() {
    try {
      const raw = localStorage.getItem("gichul.exam");
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (!d || !d.exam || !Array.isArray(d.exam.questions)) return false;
      state.exam = d.exam; state.isExample = !!d.isExample; state.answers = d.answers || {};
      return true;
    } catch (e) { return false; }
  }

  /* ---------- 작은 DOM 도우미 ---------- */
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  }
  function setStatus(msg, err) { const s = $("status"); s.textContent = msg; s.classList.toggle("err", !!err); }

  /* ---------- PDF 읽기 ---------- */
  async function readPdf(file) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      const t = tc.items.map((it) => (it.str || "") + (it.hasEOL ? "\n" : " ")).join("")
        .replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
      pages.push(t);
    }
    const chars = pages.reduce((a, p) => a + p.length, 0);
    return { pdf, pages, scanned: chars / Math.max(1, pages.length) < 40 };
  }

  async function addFiles(list) {
    if (!window.pdfjsLib) { setStatus("PDF 읽기 도구를 불러오지 못했습니다. 페이지를 새로고침해 주세요.", true); return; }
    const pdfs = [...list].filter((f) => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
    if (!pdfs.length) { setStatus("PDF 파일만 올릴 수 있습니다.", true); return; }
    for (const f of pdfs) {
      const item = { id: Math.random().toString(36).slice(2), name: f.name, pages: null, loading: true };
      state.files.push(item);
      renderFiles();
      try {
        Object.assign(item, await readPdf(f), { loading: false });
      } catch (e) {
        state.files = state.files.filter((x) => x !== item);
        setStatus(`"${f.name}"을(를) 읽지 못했습니다. 암호가 걸려 있거나 손상된 PDF일 수 있습니다.`, true);
      }
      renderFiles();
    }
  }

  function renderFiles() {
    const ul = $("files");
    ul.replaceChildren(...state.files.map((f) => {
      let meta = "읽는 중…", warn = false;
      if (!f.loading) {
        meta = f.pages.length + "쪽";
        if (f.scanned) { meta += " · 스캔본"; warn = true; }
      }
      return el("li", null,
        el("span", { class: "nm", title: f.name, text: f.name }),
        el("span", { class: "meta" + (warn ? " warn" : ""), text: meta, title: f.scanned ? "글자가 없는 스캔 PDF라 페이지 이미지로 읽습니다" : null }),
        el("button", { type: "button", "aria-label": f.name + " 빼기", text: "×", onclick: () => { state.files = state.files.filter((x) => x !== f); renderFiles(); } })
      );
    }));
    const ready = state.files.filter((f) => !f.loading);
    const m = mode();
    const go = $("go");
    if (!state.busy) go.textContent = m === "queue" ? "출제 요청 보내기" : "기출문제 출제하기";
    go.disabled = !m || !ready.length || state.files.some((f) => f.loading);
    if (!state.busy) {
      if (!m && capsChecked) setStatus("이 화면에서는 출제할 수 없습니다. 공유받은 링크라면 '참여자(Contributor)' 이상 권한이 필요해요.");
      else if (!ready.length) setStatus(m === "queue" ? "PDF를 올리고 요청을 보내면 출제자가 문제를 만들어 문제집에 올려 줍니다." : "PDF를 올리면 출제할 수 있습니다.");
      else {
        const pages = ready.reduce((a, f) => a + f.pages.length, 0);
        const scans = ready.filter((f) => f.scanned).length;
        setStatus(`자료 ${ready.length}개 · ${pages}쪽 준비됨` + (m === "queue" && scans ? ` · 스캔본 ${scans}개는 요청에 넣을 수 없어 빠집니다` : ""));
      }
    }
  }

  /* 출제 방식: 소유자는 바로 출제(내 사용량), 공유받은 사람은 요청 대기열에 넣음 */
  function mode() {
    if (isOwner && sample) return "live";
    if (db && me && canWrite !== false) return "queue";
    return null;
  }

  /* ---------- 출제 ---------- */
  function buildMaterial() {
    const ready = state.files.filter((f) => !f.loading && !f.scanned);
    const blocks = ready.map((f) => ({ name: f.name, text: f.pages.map((p, i) => `[p.${i + 1}]\n${p}`).join("\n\n") }));
    const total = blocks.reduce((a, b) => a + b.text.length, 0);
    const ratio = total > TEXT_BUDGET ? TEXT_BUDGET / total : 1;
    return blocks.map((b) => `===== 자료: ${b.name} =====\n` + (ratio < 1 ? b.text.slice(0, Math.floor(b.text.length * ratio)) + "\n(…이하 생략)" : b.text)).join("\n\n");
  }

  async function pageImages() {
    if (!imgLimits) return [];
    const scanned = state.files.filter((f) => !f.loading && f.scanned);
    const out = [];
    const max = imgLimits.maxCount;
    for (const f of scanned) {
      for (let i = 1; i <= f.pdf.numPages && out.length < max; i++) {
        const page = await f.pdf.getPage(i);
        const vp = page.getViewport({ scale: 1.6 });
        const c = document.createElement("canvas");
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
        if (blob) out.push({ blob, label: `${f.name} p.${i}` });
      }
    }
    return out;
  }

  function normalize(data) {
    const qs = (data && Array.isArray(data.questions) ? data.questions : []).map((q) => {
      let type = ["mc", "ox", "short", "essay"].includes(q.type) ? q.type : (Array.isArray(q.choices) && q.choices.length ? "mc" : "short");
      const out = {
        type,
        question: String(q.question || "").trim(),
        explanation: String(q.explanation || "").trim(),
        source: String(q.source || "").trim(),
        area: String(q.area || "").trim().slice(0, 12),
        points: Math.max(1, Math.min(20, parseInt(q.points, 10) || 3))
      };
      if (type === "mc") {
        out.choices = (q.choices || []).slice(0, 5).map((c) => String(c).replace(/^\s*[①②③④⑤]\s*/, ""));
        out.answer = parseInt(q.answer, 10);
        if (!(out.answer >= 1 && out.answer <= out.choices.length)) out.answer = null;
      } else if (type === "ox") {
        const a = String(q.answer || "").trim().toUpperCase();
        out.answer = a.startsWith("O") || a === "참" || a === "TRUE" ? "O" : "X";
      } else {
        out.answer = String(q.answer || "").trim();
      }
      return out;
    }).filter((q) => q.question && (q.type !== "mc" || q.choices.length >= 2));
    return { title: String(data?.title || "예상 기출문제"), subject: String(data?.subject || ""), questions: qs };
  }

  async function submitRequest() {
    const material = buildMaterial();
    if (!material.trim()) { setStatus("글자를 읽을 수 있는 PDF가 없습니다. 스캔본은 요청에 넣을 수 없어요.", true); return; }
    const go = $("go");
    go.disabled = true;
    state.busy = { abort() {} };
    try {
      setStatus("요청을 보내는 중…");
      const id = "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const ref = db.collection("requests").doc(id);
      const parts = [];
      for (let i = 0; i < material.length; i += CHUNK) parts.push(material.slice(i, i + CHUNK));
      for (let i = 0; i < parts.length; i++) await ref.collection("chunks").doc(String(i)).set({ text: parts[i] });
      const ready = state.files.filter((f) => !f.loading && !f.scanned);
      await ref.set({
        status: "pending",
        by: me,
        subject: $("subject").value.trim(),
        files: ready.map((f) => f.name),
        pages: ready.reduce((a, f) => a + f.pages.length, 0),
        chunks: parts.length,
        instructions: buildPrompt("", []),
        createdAt: Date.now()
      });
      setStatus("요청을 보냈습니다. 출제가 끝나면 아래 문제집에 시험지가 올라옵니다.");
    } catch (e) {
      setStatus(e && e.code === "quota_exceeded" ? "저장 공간이 가득 찼습니다. 출제자에게 알려 주세요." : "요청을 보내지 못했습니다. 권한이 없거나 연결이 끊겼을 수 있어요.", true);
    } finally {
      state.busy = null;
      renderFiles();
    }
  }

  async function saveExamToDb(exam) {
    if (!db || !isOwner) return null;
    try {
      const ref = db.collection("exams").doc("e" + Date.now().toString(36));
      await ref.set({ title: exam.title, subject: exam.subject, questions: exam.questions, by: me, createdAt: Date.now() });
      return ref.id;
    } catch (e) { return null; }
  }

  async function generate() {
    if (state.busy) { state.busy.abort(); return; }
    const types = document.querySelectorAll('input[name="type"]:checked');
    if (!types.length) { setStatus("문제 유형을 하나 이상 고르세요.", true); return; }
    if (mode() === "queue") return submitRequest();

    const ctl = new AbortController();
    state.busy = ctl;
    const go = $("go");
    go.textContent = "출제 중단"; go.classList.add("stop");
    renderLoading();
    try {
      setStatus("자료를 정리하는 중…");
      const material = buildMaterial();
      const imgs = await pageImages();
      if (!material.trim() && !imgs.length) throw { code: "no_text" };
      const opts = {
        signal: ctl.signal,
        cache: false,
        modelTier: "default",
        onText: ({ text }) => setStatus(`문제를 쓰는 중… (${text.length.toLocaleString()}자)`)
      };
      if (imgs.length) opts.images = imgs.map((i) => i.blob);
      setStatus("Claude가 자료를 읽고 출제 포인트를 고르는 중… (보통 30초~2분)");
      const data = await sample.json(buildPrompt(material, imgs.map((i) => i.label)), opts);
      const exam = normalize(data);
      if (!exam.questions.length) throw { code: "invalid_json" };
      if (!exam.subject) exam.subject = $("subject").value.trim();
      state.exam = exam; state.isExample = false;
      state.answers = {}; state.self = {}; state.open = {}; state.graded = false;
      curExamId = await saveExamToDb(exam);
      persist();
      setStatus(`${exam.questions.length}문항을 출제했습니다.` + (curExamId ? " 문제집에도 올렸어요." : ""));
    } catch (e) {
      if (e && e.code === "cancelled") setStatus("출제를 멈췄습니다.");
      else if (e && e.code === "no_text") setStatus("PDF에서 글자를 찾지 못했고, 이 화면에서는 스캔 이미지를 보낼 수 없습니다.", true);
      else setStatus(ERR[e && e.code] || "연결이 끊겨 출제하지 못했습니다. 다시 시도해 주세요.", true);
    } finally {
      state.busy = null;
      go.textContent = "기출문제 출제하기"; go.classList.remove("stop");
      renderAll();
      renderFiles();
    }
  }

  /* ---------- 채점 ---------- */
  function isRight(i) {
    const q = state.exam.questions[i], a = state.answers[i];
    if (q.type === "mc") return a != null && a === q.answer;
    if (q.type === "ox") return a === q.answer;
    return state.self[i] === true;
  }
  function score() {
    let got = 0, total = 0;
    state.exam.questions.forEach((q, i) => { total += q.points; if (isRight(i)) got += q.points; });
    return { got, total };
  }

  /* ---------- 그리기 ---------- */
  function renderLoading() {
    const sheet = $("sheet");
    sheet.replaceChildren(el("div", { class: "loading", "aria-label": "출제 중" },
      ...[60, 92, 80, 96, 70, 88, 54].map((w) => el("div", { class: "bar", style: `width:${w}%` }))));
  }

  function renderSheet() {
    const sheet = $("sheet");
    const ex = state.exam;
    if (!ex) { sheet.replaceChildren(el("p", { class: "empty", text: "공부자료를 올리고 출제하면 여기에 시험지가 나타납니다." })); return; }
    const total = ex.questions.reduce((a, q) => a + q.points, 0);
    const head = el("div", { class: "sheet-head" },
      el("div", { class: "kicker", text: (ex.subject || "예상 기출") + " · 문제지" }),
      el("h2", { text: ex.title })
    );
    const meta = el("div", { class: "sheet-meta" },
      el("span", null, "문항 수 ", el("span", { class: "tn", text: String(ex.questions.length) }), " · 배점 ", el("span", { class: "tn", text: total + "점" })),
      el("span", null, "성명 ", el("span", { class: "blank" }), "  학번 ", el("span", { class: "blank" }))
    );
    const list = el("div", { class: "questions" }, ...ex.questions.map((q, i) => renderQ(q, i)));
    const nodes = [];
    if (state.isExample) nodes.push(el("div", { class: "ex-flag", text: "예시 시험지 · PDF를 올려 내 자료로 출제하세요" }));
    nodes.push(head, meta, list);
    sheet.replaceChildren(...nodes);
  }

  function renderQ(q, i) {
    const a = state.answers[i];
    const art = el("article", { class: "q", id: "q" + i });
    art.append(el("p", { class: "q-text" },
      el("span", { class: "q-no", text: (i + 1) + "." }),
      q.question + " ",
      el("span", { class: "q-pts", text: `[${q.points}점]` }),
      el("span", { class: "q-type", text: TYPE_LABEL[q.type] }),
      q.area ? el("span", { class: "q-type", text: q.area }) : null
    ));
    if (q.type === "mc") {
      art.append(el("ol", { class: "choices" }, ...q.choices.map((c, k) => {
        const n = k + 1;
        let cls = "choice";
        if (a === n) cls += " sel";
        if (state.graded && n === q.answer) cls += " right";
        if (state.graded && a === n && n !== q.answer) cls += " miss";
        return el("li", null, el("button", { type: "button", class: cls, "aria-pressed": a === n ? "true" : "false", onclick: () => pick(i, n) },
          el("span", { class: "mk", text: MARKS[k] }), el("span", { text: c })));
      })));
    } else if (q.type === "ox") {
      art.append(el("div", { class: "ox" }, ...["O", "X"].map((v) => {
        let cls = "choice";
        if (a === v) cls += " sel";
        if (state.graded && v === q.answer) cls += " right";
        if (state.graded && a === v && v !== q.answer) cls += " miss";
        return el("button", { type: "button", class: cls, "aria-pressed": a === v ? "true" : "false", onclick: () => pick(i, v), text: v });
      })));
    } else {
      const ta = el("textarea", { class: "write" + (q.type === "short" ? " short" : ""), id: "ans" + i, "aria-label": (i + 1) + "번 답안", placeholder: "답을 쓰세요" });
      ta.value = typeof a === "string" ? a : "";
      ta.addEventListener("input", () => { state.answers[i] = ta.value; persist(); });
      art.append(ta);
    }
    const open = state.open[i] || state.graded;
    if (open) art.append(renderSol(q, i));
    if (!state.graded) {
      art.append(el("div", { class: "q-tools" }, el("button", { type: "button", class: "link", text: state.open[i] ? "해설 접기" : "정답·해설 보기", onclick: () => { state.open[i] = !state.open[i]; renderSheet(); } })));
    }
    return art;
  }

  function renderSol(q, i) {
    let ans;
    if (q.type === "mc") ans = q.answer ? `${MARKS[q.answer - 1]} ${q.choices[q.answer - 1]}` : "정답 정보 없음";
    else ans = q.answer;
    const box = el("div", { class: "sol" },
      el("p", { class: "ans", text: "정답  " + ans }),
      q.explanation ? el("p", { text: q.explanation }) : null,
      q.source ? el("p", { class: "src", text: "근거  " + q.source }) : null
    );
    if (q.type === "short" || q.type === "essay") {
      const v = state.self[i];
      box.append(el("div", { class: "selfcheck" },
        el("span", { text: "모범답안과 비교해 보세요" }),
        el("button", { type: "button", class: v === true ? "on-ok" : "", onclick: () => { state.self[i] = true; renderAll(); }, text: "맞음" }),
        el("button", { type: "button", class: v === false ? "on-no" : "", onclick: () => { state.self[i] = false; renderAll(); }, text: "틀림" })
      ));
    }
    return box;
  }

  function renderOmr() {
    const ex = state.exam, rows = $("omrRows");
    if (!ex) { rows.replaceChildren(); $("omrCount").textContent = ""; return; }
    $("omrCount").textContent = ex.questions.length + "문항";
    rows.replaceChildren(...ex.questions.map((q, i) => {
      const a = state.answers[i];
      let cls = "omr-row";
      if (state.graded) cls += isRight(i) ? " right" : (q.type === "mc" || q.type === "ox" || state.self[i] === false ? " wrongrow" : "");
      let body;
      if (q.type === "mc" || q.type === "ox") {
        const opts = q.type === "mc" ? q.choices.map((_, k) => k + 1) : ["O", "X"];
        body = el("div", { class: "bubbles" }, ...opts.map((v) => {
          let c = "bub";
          if (a === v) c += " on";
          if (state.graded && v === q.answer) c += " key";
          return el("button", { type: "button", class: c, "aria-label": `${i + 1}번 ${v}`, onclick: () => pick(i, v), text: String(v) });
        }));
      } else {
        const label = state.graded || state.self[i] != null
          ? (state.self[i] === true ? "맞음" : state.self[i] === false ? "틀림" : "자가채점 필요")
          : (typeof a === "string" && a.trim() ? "작성함" : TYPE_LABEL[q.type]);
        body = el("button", { type: "button", class: "link omr-note", onclick: () => document.getElementById("q" + i).scrollIntoView({ behavior: "smooth", block: "center" }), text: label });
      }
      return el("div", { class: cls }, el("span", { class: "n", text: String(i + 1) }), body);
    }));
    const s = score();
    if (state.graded) {
      const pending = ex.questions.filter((q, i) => (q.type === "short" || q.type === "essay") && state.self[i] == null).length;
      $("scoreBig").textContent = `${s.got}`;
      $("scoreSub").textContent = `/ ${s.total}점` + (pending ? ` · 서술·단답 ${pending}문항 자가채점 남음` : "");
    } else {
      const done = Object.keys(state.answers).filter((k) => state.answers[k] !== "" && state.answers[k] != null).length;
      $("scoreBig").textContent = `${done}/${ex.questions.length}`;
      $("scoreSub").textContent = "답을 고른 뒤 채점하세요";
    }
    $("grade").textContent = state.graded ? "다시 풀기" : "채점하기";
    $("showAll").hidden = state.graded;
  }

  function renderAll() { renderSheet(); renderOmr(); }

  function pick(i, v) {
    if (state.graded) return;
    state.answers[i] = state.answers[i] === v ? null : v;
    persist();
    renderAll();
  }

  /* ---------- 파일로 저장 ---------- */
  function examText() {
    const ex = state.exam;
    const L = [ex.title, ex.subject ? "과목: " + ex.subject : "", ""];
    ex.questions.forEach((q, i) => {
      L.push(`${i + 1}. ${q.area ? "[" + q.area + "] " : ""}${q.question} [${q.points}점]`);
      if (q.type === "mc") q.choices.forEach((c, k) => L.push(`   ${MARKS[k]} ${c}`));
      if (q.type === "ox") L.push("   ( O / X )");
      L.push("");
    });
    L.push("", "──────── 정답 및 해설 ────────", "");
    ex.questions.forEach((q, i) => {
      const ans = q.type === "mc" ? (q.answer ? MARKS[q.answer - 1] : "?") : q.answer;
      L.push(`${i + 1}. 정답: ${ans}`);
      if (q.explanation) L.push("   해설: " + q.explanation);
      if (q.source) L.push("   근거: " + q.source);
      L.push("");
    });
    return L.join("\n");
  }

  /* ---------- 이벤트 ---------- */
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  $("file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
  $("go").addEventListener("click", generate);
  $("grade").addEventListener("click", () => {
    if (!state.exam) return;
    if (state.graded) { state.graded = false; state.answers = {}; state.self = {}; state.open = {}; persist(); }
    else state.graded = true;
    renderAll();
    if (state.graded) $("sheet").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("showAll").addEventListener("click", () => {
    if (!state.exam) return;
    const allOpen = state.exam.questions.every((_, i) => state.open[i]);
    state.exam.questions.forEach((_, i) => { state.open[i] = !allOpen; });
    $("showAll").textContent = allOpen ? "해설 모두 보기" : "해설 모두 접기";
    renderSheet();
  });
  $("reset").addEventListener("click", () => { state.answers = {}; state.self = {}; state.graded = false; persist(); renderAll(); });
  $("save").addEventListener("click", async () => {
    if (!downloads || !state.exam) return;
    const name = (state.exam.title || "기출문제").replace(/[\\/:*?"<>|]/g, " ").trim().slice(0, 80) + ".txt";
    try { await downloads.save({ filename: name, data: examText() }); } catch (e) {}
  });

  /* ---------- 시작 ---------- */
  if (!restore()) { state.exam = EXAMPLE; state.isExample = true; }
  renderAll();
  renderFiles();

  /* ---------- 문제집 (공유 저장소) ---------- */
  const STATUS = { pending: "대기 중", working: "출제 중", done: "완료", error: "실패" };
  function when(ms) {
    try { return new Date(ms).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; }
  }
  function openExam(id) {
    const d = exams.find((x) => x.id === id);
    if (!d) return;
    state.exam = normalize(d);
    if (!state.exam.subject) state.exam.subject = String(d.subject || "");
    state.isExample = false; curExamId = id;
    state.answers = {}; state.self = {}; state.open = {}; state.graded = false;
    persist(); renderAll(); renderLib();
    $("sheet").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function renderLib() {
    $("libStep").hidden = !db;
    const mine = requests.filter((r) => isOwner || r.by === me).slice(0, 10);
    $("reqHead").hidden = !mine.length;
    $("reqList").replaceChildren(...mine.map((r) => {
      const name = r.subject || (Array.isArray(r.files) ? r.files.join(", ") : "요청");
      const right = r.status === "done" && r.examId
        ? el("button", { type: "button", class: "open", text: "열기", onclick: () => openExam(r.examId) })
        : el("span", { class: "pill " + (r.status || "pending"), text: STATUS[r.status] || "대기 중" });
      return el("li", null,
        el("span", { class: "t", title: name, text: name }), right,
        el("span", { class: "s", text: when(r.createdAt) + (r.status === "error" && r.error ? " · " + r.error : "") }));
    }));
    $("examList").replaceChildren(...(exams.length ? exams.map((x) => el("li", { class: x.id === curExamId ? "cur" : "" },
      el("span", { class: "t", title: x.title, text: x.title || "시험지" }),
      el("button", { type: "button", class: "open", text: x.id === curExamId ? "보는 중" : "풀기", onclick: () => openExam(x.id) }),
      el("span", { class: "s", text: `${(x.questions || []).length}문항 · ${when(x.createdAt)}` })
    )) : [el("li", null, el("span", { class: "s", text: "아직 올라온 시험지가 없어요. 출제하면 여기에 쌓입니다." }))]));
  }
  function watchLib() {
    db.collection("exams").orderBy("createdAt", "desc").limit(50).onSnapshot(
      (snap) => { exams = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLib(); },
      () => {});
    db.collection("requests").orderBy("createdAt", "desc").limit(30).onSnapshot(
      (snap) => {
        const before = new Map(requests.map((r) => [r.id, r.status]));
        requests = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        const justDone = requests.find((r) => r.by === me && r.status === "done" && before.get(r.id) && before.get(r.id) !== "done");
        if (justDone && !state.busy) setStatus("요청한 시험지가 완성됐어요. 문제집에서 열어 보세요.");
        renderLib();
      },
      () => {});
  }

  if (window.claude && window.claude.use) {
    Promise.all([
      claude.use("sample"),
      claude.use("db"),
      claude.use("user")
    ]).then(async ([s, d, u]) => {
      sample = s; db = d;
      if (u) {
        try { isOwner = !!(await u.isOwner()); } catch (e) {}
        try { me = await u.id(); } catch (e) {}
        try { canWrite = await u.can("data.write"); } catch (e) {}
      }
      if (s && isOwner) { try { imgLimits = (await s.limits()).images || null; } catch (e) { imgLimits = null; } }
      capsChecked = true;
      if (db) watchLib();
      renderLib();
      renderFiles();
    });
    claude.use("downloads").then((d) => { downloads = d; $("save").hidden = !d; });
  } else { capsChecked = true; renderFiles(); }
})();
</script>
