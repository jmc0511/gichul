name: gichuri
description: "기추리 - 기출문제로 나만의 시험지 만들기"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  flutter_web_auth_2: ^5.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# 앱 아이콘: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "../../brand/icon-1024.png"
  remove_alpha_ios: true # 아이폰 아이콘에는 투명이 있으면 안 됨
  ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "../../brand/icon-1024.png"
  adaptive_icon_foreground_inset: 18 # 안드로이드가 둥글게 자르는 만큼 안으로
  min_sdk_android: 24

# 첫 화면: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0f1218"
  color_dark: "#0f1218"
  image: assets/splash-icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0f1218"
    color_dark: "#0f1218"
    image: assets/splash-icon-android12.png
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#ffffff"
