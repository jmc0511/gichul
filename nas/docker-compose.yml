services:
  gichul-worker:
    build: .
    container_name: gichul-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - POLL_SECONDS=30
      - MAX_PARALLEL=3
      # 더 빠르게: sonnet / 기본 모델 쓰려면 비워 둠
      - CLAUDE_MODEL=
      # 보안: claude.ai 계정에 연결된 커넥터(Google Drive 등)를 처리기에서 쓰지 않음
      - ENABLE_CLAUDEAI_MCP_SERVERS=false
    volumes:
      - work:/work

volumes:
  work:
