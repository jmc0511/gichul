services:
  gichul-worker:
    build: .
    container_name: gichul-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - POLL_SECONDS=30
      - MAX_PARALLEL=3
      # 더 빠르게: sonnet / 기본 모델 쓰려면 비워 둠
      - CLAUDE_MODEL=claude-opus-5-5
      # 보안: claude.ai 계정에 연결된 커넥터(Google Drive 등)를 처리기에서 쓰지 않음
      - ENABLE_CLAUDEAI_MCP_SERVERS=false
    volumes:
      # 코드를 폴더째 연결한다. 파일을 덮어쓰고 '다시 시작'만 하면 반영된다(이미지 다시 만들 필요 없음)
      - ./:/app/src:ro
      - work:/work

volumes:
  work:
